name: WalkMate
options:
  bundleIdPrefix: accera.world
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "X2SP6R5LL3"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    GENERATE_INFOPLIST_FILE: YES

targetTemplates:
  TestTarget:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: WalkMate
    settings:
      base:
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"

targets:
  WalkMate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Core
      - path: Models
      - path: Features
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: accera.world.walkmate
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        FRAMEWORK_SEARCH_PATHS:
          - $(SRCROOT)/Frameworks
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    dependencies:
      - framework: Frameworks/INSCameraSDK.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/INSCameraServiceSDK.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/INSCoreMedia.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/SSZipArchive.xcframework
        embed: true
        codeSign: true

  CameraTests:
    templates:
      - TestTarget
    sources:
      - path: ../Tests/CameraTests

  InferenceTests:
    templates:
      - TestTarget
    sources:
      - path: ../Tests/InferenceTests

  GeometryTests:
    templates:
      - TestTarget
    sources:
      - path: ../Tests/GeometryTests

  PerceptionTests:
    templates:
      - TestTarget
    sources:
      - path: ../Tests/PerceptionTests

  ToolkitTests:
    templates:
      - TestTarget
    sources:
      - path: ../Tests/ToolkitTests

  AudioTests:
    templates:
      - TestTarget
    sources:
      - path: ../Tests/AudioTests

  AppTests:
    templates:
      - TestTarget
    sources:
      - path: ../Tests/AppTests
    dependencies:
      - framework: Frameworks/SSZipArchive.xcframework

  ReplayTests:
    templates:
      - TestTarget
    sources:
      - path: ../Tests/ReplayTests
    dependencies:
      - framework: Frameworks/SSZipArchive.xcframework

schemes:
  WalkMate:
    build:
      targets:
        WalkMate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CameraTests
        - InferenceTests
        - GeometryTests
        - PerceptionTests
        - ToolkitTests
        - AudioTests
        - AppTests
        - ReplayTests



